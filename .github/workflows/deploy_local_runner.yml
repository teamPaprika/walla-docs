name: Deploy to GitHub Pages (local runner)

on:
  push:
    branches:
      - main
  workflow_dispatch:  # 검증 브랜치는 main push 가 GitHub Pages 와 묶여 있어 별도 push 트리거를 두지 않는다. preview_local_runner.yml(PR 트리거) 로 chuncom runner 동작을 먼저 검증.

permissions:
  contents: read
  pages: write
  id-token: write

# 별도 group — 기존 deploy.yml 과 충돌 안 함
concurrency:
  group: pages-local-runner
  cancel-in-progress: false

# Windows self-hosted runner: Git Bash 8.3 short path 명시 (WSL bash 회피)
defaults:
  run:
    shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
