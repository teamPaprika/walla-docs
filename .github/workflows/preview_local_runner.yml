name: PR Preview Build (local runner)

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

# 별도 group — 기존 preview.yml 과 충돌 안 함
concurrency:
  group: preview-local-runner-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

# Windows self-hosted runner: Git Bash 8.3 short path 명시 (WSL bash 회피)
defaults:
  run:
    shell: 'C:\PROGRA~1\Git\bin\bash.exe --noprofile --norc -eo pipefail {0}'

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-build
          path: out
          retention-days: 5
